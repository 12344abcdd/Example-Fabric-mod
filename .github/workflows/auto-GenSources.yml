name: Generate and Push Source

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "1.21"

jobs:
  generate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate sources
        run: ./gradlew genSources

      - name: Explore loom-cache directory
        run: |
          echo "=== Exploring .gradle/loom-cache ==="
          if [ -d ".gradle/loom-cache" ]; then
            echo "Loom cache directory structure:"
            find .gradle/loom-cache -type d | sort
            echo ""
            echo "JAR files in loom-cache:"
            find .gradle/loom-cache -name "*.jar" | sort
            echo ""
            echo "Minecraft-related files:"
            find .gradle/loom-cache -name "*minecraft*" -o -name "*client*" -o -name "*server*" | sort
          else
            echo ".gradle/loom-cache directory not found"
          fi

      - name: Find generated files
        id: find-files
        run: |
          # 查找JAR文件（现在知道在.gradle/loom-cache中）
          echo "Searching for generated files..."
          
          # 查找JAR文件
          find .gradle/loom-cache -name "*.jar" > jar-list.txt 2>/dev/null || true
          
          # 查找反编译的源代码（通常在build目录）
          find . -type d -name "sources" -path "*/build/*" > source-dirs.txt 2>/dev/null || true
          find . -type d -name "java" -path "*/build/*" >> source-dirs.txt 2>/dev/null || true
          
          # 查找映射文件
          find .gradle/loom-cache -name "mappings*" -type f > mapping-files.txt 2>/dev/null || true
          
          echo "=== JAR Files ==="
          if [ -s jar-list.txt ]; then
            cat jar-list.txt
            JAR_COUNT=$(wc -l < jar-list.txt)
            echo "Total JAR files found: $JAR_COUNT"
          else
            echo "No JAR files found"
          fi
          
          echo "=== Source Directories ==="
          if [ -s source-dirs.txt ]; then
            cat source-dirs.txt
            DIR_COUNT=$(wc -l < source-dirs.txt)
            echo "Total source directories found: $DIR_COUNT"
          else
            echo "No source directories found"
          fi
          
          echo "=== Mapping Files ==="
          if [ -s mapping-files.txt ]; then
            cat mapping-files.txt
          else
            echo "No mapping files found"
          fi

      - name: Commit and push to current repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-commit generated sources and cache [skip ci]"
            git push
          fi

      - name: Push to minecraft repository
        run: |
          # 克隆目标仓库
          git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/12344abcdd/minecraft.git minecraft-repo
          cd minecraft-repo
          
          # 创建带时间戳的新分支
          BRANCH_NAME="decompiled/$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH_NAME
          
          # 清理目标仓库（保留.git）
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} + 2>/dev/null || true
          
          echo "Copying generated files from source repository..."
          
          # 创建目录结构
          mkdir -p loom-cache
          mkdir -p build-artifacts
          mkdir -p src/main/java
          
          # 复制loom-cache中的JAR文件
          if [ -d "../.gradle/loom-cache" ]; then
            echo "Copying loom-cache contents..."
            cp -r ../.gradle/loom-cache/* loom-cache/ 2>/dev/null || true
            
            # 特别复制JAR文件到显眼位置
            find ../.gradle/loom-cache -name "*.jar" -exec cp {} . \; 2>/dev/null || true
            mkdir -p jars
            find ../.gradle/loom-cache -name "*.jar" -exec cp {} jars/ \; 2>/dev/null || true
          fi
          
          # 复制构建目录中的源代码
          if [ -d "../build" ]; then
            echo "Copying build artifacts..."
            cp -r ../build/* build-artifacts/ 2>/dev/null || true
            
            # 复制反编译的Java源代码
            if [ -d "../build/sources/main/java" ]; then
              echo "Copying decompiled Java sources..."
              cp -r ../build/sources/main/java/* src/main/java/ 2>/dev/null || true
            fi
            
            # 尝试其他可能的源代码位置
            for java_dir in ../build/*/main/java; do
              if [ -d "$java_dir" ]; then
                echo "Copying Java sources from: $java_dir"
                cp -r "$java_dir"/* src/main/java/ 2>/dev/null || true
              fi
            done
          fi
          
          # 复制gradle缓存中的映射文件
          if [ -d "../.gradle" ]; then
            find ../.gradle -name "mappings*" -type f -exec cp {} . \; 2>/dev/null || true
          fi
          
          # 创建目录结构文件（使用简单的格式避免转义问题）
          cat > directory-structure.txt << 'EOF'
Generated on: $(date)
Source repository: ${{ github.repository }}

Directory Structure:
EOF
      #    find . -type d | sort >> directory-structure.txt
          
          echo "" >> directory-structure.txt
          echo "JAR Files:" >> directory-structure.txt
          find . -name "*.jar" | sort >> directory-structure.txt
          
          echo "" >> directory-structure.txt
          echo "Java Source Files (first 100):" >> directory-structure.txt
          find . -name "*.java" | head -100 | sort >> directory-structure.txt
          
          echo "" >> directory-structure.txt
          echo "Mapping Files:" >> directory-structure.txt
          find . -name "mappings*" | sort >> directory-structure.txt
          
          # 创建README（使用简单的格式）
          cat > README.md << 'EOF'
# Minecraft Decompilation Results

This branch contains automatically generated Minecraft decompilation artifacts.

## Contents

- **loom-cache/**: Fabric Loom cache files including Minecraft JARs
- **jars/**: Minecraft client/server JAR files  
- **src/main/java/**: Decompiled Java source code
- **build-artifacts/**: Gradle build outputs
- **mapping files**: Obfuscation mapping files

## Generation Details

- Generated: $(date)
- Source: [12344abcdd/Example-Fabric-mod](https://github.com/12344abcdd/Example-Fabric-mod)
- Workflow: [Run #${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

## File Locations

- **Minecraft JARs**: `.gradle/loom-cache/`
- **Decompiled Source**: `build/sources/main/java/`
- **Mappings**: `.gradle/loom-cache/mappings/`
EOF
          
          # 添加统计信息到README
          echo "" >> README.md
          echo "## Statistics" >> README.md
          echo "- JAR files: $(find . -name "*.jar" | wc -l)" >> README.md
          echo "- Java files: $(find . -name "*.java" | wc -l)" >> README.md
          echo "- Total size: $(du -sh . | cut -f1)" >> README.md
          
          # 提交到目标仓库
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit to minecraft repo."
          else
            git commit -m "feat: minecraft decompilation results - $(date +%Y%m%d-%H%M%S)"
            git push --set-upstream origin $BRANCH_NAME
            echo "✅ Successfully pushed to branch: $BRANCH_NAME"
            
            # 显示推送信息
            echo "📦 Pushed contents:"
            find . -type f -name "*.jar" -o -name "*.java" | head -10 | sort
          fi

      - name: Create workflow summary
        run: |
          echo "## 🎯 Minecraft Decompilation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 显示找到的JAR文件
          if [ -f jar-list.txt ] && [ -s jar-list.txt ]; then
            echo "### 📦 JAR Files Found ($(wc -l < jar-list.txt))" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat jar-list.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ No JAR files found in loom-cache" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Repository:** [12344abcdd/Example-Fabric-mod](https://github.com/12344abcdd/Example-Fabric-mod)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Branch:** [12344abcdd/minecraft/tree/decompiled/$(date +%Y%m%d-%H%M%S)](https://github.com/12344abcdd/minecraft/tree/decompiled/$(date +%Y%m%d-%H%M%S))" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Artifacts Included" >> $GITHUB_STEP_SUMMARY
          echo "- Minecraft JAR files from `.gradle/loom-cache/`" >> $GITHUB_STEP_SUMMARY
          echo "- Decompiled Java source code" >> $GITHUB_STEP_SUMMARY
          echo "- Mapping files" >> $GITHUB_STEP_SUMMARY
          echo "- Build artifacts" >> $GITHUB_STEP_SUMMARY
