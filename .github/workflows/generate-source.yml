name: Generate and Extract Minecraft Common Sources Jar

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "1.21"

jobs:
  Generate-Source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/loom-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate sources
        run: ./gradlew genSources --no-daemon --parallel

      - name: Commit and push all changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-commit all changes [skip ci]"
            git push
          fi

  Extract-And-Push:
    runs-on: ubuntu-latest
    needs: Generate-Source
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Minecraft version and yarn build from gradle.properties
        id: parse_version
        run: |
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          YARN_RAW=$(grep '^yarn_mappings=' gradle.properties | cut -d'=' -f2)
          YARN_FORMAT="net.fabricmc.yarn.${MC_VERSION//./_}.${YARN_RAW}"
          BRANCH="${MC_VERSION}-${YARN_FORMAT}-common"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Branch name: $BRANCH"
          # 生成 source jar 路径（适配 loom 默认缓存结构）
          SOURCE_JAR_PATH=".gradle/loom-cache/minecraftMaven/net/minecraft/minecraft-common-*/${MC_VERSION}-net.fabricmc.yarn.${MC_VERSION//./_}.${YARN_RAW}-v2/minecraft-common-*-${MC_VERSION}-net.fabricmc.yarn.${MC_VERSION//./_}.${YARN_RAW}-sources.jar"
          echo "source_jar_path=$SOURCE_JAR_PATH" >> $GITHUB_OUTPUT
          echo "Source jar path: $SOURCE_JAR_PATH"

      - name: Find and extract Minecraft Common Sources Jar
        run: |
          mkdir extracted_sources
          ACTUAL_SOURCE_JAR=$(ls ${{ steps.parse_version.outputs.source_jar_path }} | head -n 1)
          echo "Actual source jar: $ACTUAL_SOURCE_JAR"
          unzip -q "$ACTUAL_SOURCE_JAR" -d extracted_sources

      - name: Checkout target minecraft repo
        uses: actions/checkout@v4
        with:
          repository: 12344abcdd/minecraft
          token: ${{ secrets.PAT }}
          path: mc_repo

      - name: Copy Extracted Source
        run: |
          cp -r extracted_sources/* mc_repo/

      - name: Create branch if not exist, commit and push
        run: |
          cd mc_repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ steps.parse_version.outputs.branch }}"
          if ! git ls-remote --exit-code origin "refs/heads/$BRANCH"; then
            git checkout -b "$BRANCH"
          else
            git fetch origin "$BRANCH:$BRANCH"
            git checkout "$BRANCH"
          fi
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extracted Minecraft common sources jar for $BRANCH"
            git push origin HEAD:"$BRANCH"
          fi
