name: Generate and Extract Minecraft Common Sources Jar

on:
  workflow_dispatch:
  push:

jobs:
  Generate-Source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/loom-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate sources
        run: ./gradlew genSources --no-daemon --parallel

      - name: Generate sources jar
        run: ./gradlew sourcesJar --no-daemon --parallel

      - name: Commit and push all changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-commit all changes [skip ci]"
            git push
          fi

  Extract-And-Push:
    runs-on: ubuntu-latest
    needs: Generate-Source
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Minecraft version and yarn build from gradle.properties
        id: parse_version
        run: |
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          YARN_RAW=$(grep '^yarn_mappings=' gradle.properties | cut -d'=' -f2)
          YARN_FORMAT="net.fabricmc.yarn.${MC_VERSION//./_}.${YARN_RAW}"
          BRANCH="${MC_VERSION}-${YARN_FORMAT}-common"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Branch name: $BRANCH"

      - name: List all sources jars (debug)
        run: find . -name "*-sources.jar"

      - name: Find and extract Minecraft Common Sources Jar
        run: |
          rm -rf extracted_sources
          mkdir -p extracted_sources
          SOURCE_JAR=$(find . -name "*-sources.jar" | head -n 1)
          echo "Actual source jar: $SOURCE_JAR"
          unzip -oq "$SOURCE_JAR" -d extracted_sources
          echo "解压后内容："
          ls -al extracted_sources || true

      - name: Find and extract Minecraft Common Jar (non-class files)
        run: |
          rm -rf extracted_nonclass
          mkdir -p extracted_nonclass
          JAR_FILE=$(find . -name "minecraft-common-*.jar" ! -name "*-sources.jar" | head -n 1)
          echo "Actual jar: $JAR_FILE"
          if [ -n "$JAR_FILE" ]; then
            unzip -oq "$JAR_FILE" -d extracted_nonclass
            find extracted_nonclass -type f -name "*.class" -delete
          else
            echo "No minecraft-common-*.jar found!"
            exit 1
          fi
          echo "非class文件解压后内容："
          find extracted_nonclass | head -50

      - name: Checkout target minecraft repo
        uses: actions/checkout@v4
        with:
          repository: 12344abcdd/minecraft
          token: ${{ secrets.PAT }}
          path: mc_repo

      - name: Create branch if not exist and checkout
        run: |
          cd mc_repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ steps.parse_version.outputs.branch }}"
          if ! git ls-remote --exit-code origin "refs/heads/$BRANCH"; then
            git checkout -b "$BRANCH"
          else
            git fetch origin "$BRANCH:$BRANCH"
            git checkout "$BRANCH"
          fi

      - name: Copy Extracted Source
        run: |
          cp -r ../extracted_sources/* ./
          echo "=== 源码文件复制后 ==="
          find . -type f | head -50

      - name: Copy Extracted Non-class Files (from jar)
        run: |
          cp -r ../extracted_nonclass/* ./
          echo "=== 资源文件复制后 ==="
          find . -type f | grep -E 'assets/|data/|META-INF/' || echo "No resource files found"

      - name: Commit and push
        run: |
          git add -f .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extracted Minecraft common sources jar and non-class files for $BRANCH"
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git push origin "$CURRENT_BRANCH:$CURRENT_BRANCH"
          fi
