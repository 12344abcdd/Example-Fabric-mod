name: Generate Source

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "1.21"

jobs:
  Generate-Source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate sources
        run: ./gradlew genSources

      - name: Commit and push all changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-commit all changes [skip ci]"
            git push
          fi


  Decompile-And-Push:
    runs-on: ubuntu-latest
    needs: Generate-Source
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Download CFR Decompiler
        run: wget https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar

      - name: Decompile Minecraft Common Jar
        run: |
          mkdir decompiled
          java -jar cfr-0.152.jar ".gradle/loom-cache/minecraftMaven/net/minecraft/minecraft-common-48f5f74c97/1.21.1-net.fabricmc.yarn.1_21_1.1.21.1+build.3-v2/minecraft-common-48f5f74c97-1.21.1-net.fabricmc.yarn.1_21_1.1.21.1+build.3-v2.jar" --outputdir decompiled

      - name: Checkout target minecraft repo
        uses: actions/checkout@v4
        with:
          repository: 12344abcdd/minecraft
          token: ${{ secrets.PAT }}
          # 使用 main 分支检出，后续脚本处理分支创建
          ref: main
          path: mc_repo

      - name: Copy Decompiled Source
        run: |
          cp -r decompiled/* mc_repo/

      - name: Create branch if not exist, commit and push
        run: |
          cd mc_repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="1.21.1-net.fabricmc.yarn.1_21_1.1.21.1+build.3-v2-common"
          # 如果远程分支不存在，则新建分支
          if ! git ls-remote --exit-code origin refs/heads/$BRANCH; then
            git checkout -b $BRANCH
          else
            git fetch origin $BRANCH:$BRANCH
            git checkout $BRANCH
          fi
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Decompiled Minecraft common jar for $BRANCH"
            git push origin HEAD:$BRANCH
          fi
