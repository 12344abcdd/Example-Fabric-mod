name: Generate and Decompile Minecraft Common Jar

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "1.21"

jobs:
  Generate-Source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/loom-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate sources
        run: ./gradlew genSources --no-daemon --parallel

      - name: Commit and push all changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-commit all changes [skip ci]"
            git push
          fi

  Decompile-And-Push:
    runs-on: ubuntu-latest
    needs: Generate-Source
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Minecraft version and yarn build from gradle.properties
        id: parse_version
        run: |
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          YARN_RAW=$(grep '^yarn_mappings=' gradle.properties | cut -d'=' -f2)
          # 格式化 yarn 为 net.fabricmc.yarn.1_21_1.1.21.1+build.3
          YARN_FORMAT="net.fabricmc.yarn.${MC_VERSION//./_}.${YARN_RAW}"
          BRANCH="${MC_VERSION}-${YARN_FORMAT}-common"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Branch name: $BRANCH"
          # 生成 jar 路径（适配 loom 默认缓存结构）
          JAR_PATH=".gradle/loom-cache/minecraftMaven/net/minecraft/minecraft-common-*/${MC_VERSION}-net.fabricmc.yarn.${MC_VERSION//./_}.${YARN_RAW}-v2/minecraft-common-*-${MC_VERSION}-net.fabricmc.yarn.${MC_VERSION//./_}.${YARN_RAW}-v2.jar"
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "Jar path: $JAR_PATH"

      - name: Download CFR Decompiler
        run: wget https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar

      - name: Find and decompile Minecraft Common Jar
        run: |
          mkdir decompiled
          # 自动查找实际 jar 路径（处理星号）
          ACTUAL_JAR=$(ls ${{ steps.parse_version.outputs.jar_path }} | head -n 1)
          echo "Actual jar: $ACTUAL_JAR"
          java -jar cfr-0.152.jar "$ACTUAL_JAR" --outputdir decompiled

      - name: Checkout target minecraft repo
        uses: actions/checkout@v4
        with:
          repository: 12344abcdd/minecraft
          token: ${{ secrets.PAT }}
          path: mc_repo

      - name: Copy Decompiled Source
        run: |
          cp -r decompiled/* mc_repo/

      - name: Create branch if not exist, commit and push
        run: |
          cd mc_repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ steps.parse_version.outputs.branch }}"
          # 判断分支是否存在，不存在则新建
          if ! git ls-remote --exit-code origin "refs/heads/$BRANCH"; then
            git checkout -b "$BRANCH"
          else
            git fetch origin "$BRANCH:$BRANCH"
            git checkout "$BRANCH"
          fi
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Decompiled Minecraft common jar for $BRANCH"
            git push origin HEAD:"$BRANCH"
          fi
