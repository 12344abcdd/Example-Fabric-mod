name: Clean Loom Cache (Manual)

on:
  workflow_dispatch:

jobs:
  clean-loom-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove all files in .gradle/loom-cache
        run: |
          rm -rf .gradle/loom-cache/*
          echo ".gradle/loom-cache/* has been cleaned."

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .gradle/loom-cache
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: clean loom-cache [skip ci]"
            git push
          fi
